spring.application.name=socialapp-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Connection (MySQL / MariaDB)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/socialapp?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:socialapp}
spring.datasource.password=${DB_PASS:socialapp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# SocialApp JWT Security Properties
app.jwt.secret=${JWT_SECRET:c29jaWFsYXBwLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yNTYtYml0cyE=}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:168}

# SocialApp Storage & Media Properties
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.storage.mode=${STORAGE_MODE:local}
app.storage.local-dir=${LOCAL_STORAGE_DIR:./media-storage}
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.bucket=${R2_BUCKET:socialapp}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:https://pub-r2.dev}
app.ffmpeg.path=${FFMPEG_PATH:/usr/sbin/ffmpeg}
app.placeholder-thumb-url=${PLACEHOLDER_THUMB_URL:http://localhost:8080/placeholder-thumb.jpg}
