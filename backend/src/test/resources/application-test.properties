# =============================================================================
# Automated Test Suite Configuration (H2 In-Memory Database)
# =============================================================================
spring.datasource.url=jdbc:h2:mem:socialapp_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT Configuration for Testing
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tMjU2LWJpdHMhISE=
app.jwt.expiry-hours=168

# Test App Base Properties
app.base-url=http://localhost:8080
app.storage.mode=local
app.storage.local-dir=target/test-media-storage
app.ffmpeg.path=ffmpeg
app.placeholder-thumb-url=http://localhost:8080/placeholder-thumb.jpg
